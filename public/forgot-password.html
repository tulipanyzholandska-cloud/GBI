<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — GetBizIdea</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111827'/><text y='24' x='4' font-size='22'>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
nav{height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #E5E7EB}
.logo{font-size:18px;font-weight:800;color:#111827;letter-spacing:-.02em}
.logo span{color:#6366F1}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px;text-align:center}
.subtitle{text-align:center;font-size:14px;color:#6B7280;margin-bottom:28px;line-height:1.5}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input[type=email]{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;color:#111827;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s;background:#fff}
input:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input::placeholder{color:#9CA3AF}
.btn-primary{width:100%;padding:13px;border-radius:10px;border:none;background:#111827;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .18s;font-family:inherit;margin-top:4px}
.btn-primary:hover{background:#374151}
.btn-primary:disabled{background:#9CA3AF;cursor:not-allowed}
.back{display:block;text-align:center;font-size:13px;color:#6B7280;margin-top:20px}
.back a{color:#6366F1;font-weight:600}
.err{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;font-size:13px;color:#DC2626;margin-bottom:14px;display:none}
.err.show{display:block}
.success-state{text-align:center;padding:20px 0}
.success-icon{font-size:48px;margin-bottom:16px}
.success-state h2{font-size:20px;font-weight:700;margin-bottom:8px}
.success-state p{font-size:14px;color:#6B7280;line-height:1.6}
footer{padding:20px 32px;text-align:center;font-size:12px;color:#9CA3AF}
footer a{color:#9CA3AF}
footer a:hover{color:#6366F1}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">GetBiz<span>Idea</span></a>
</nav>

<main>
  <div class="card">
    <div id="form-state">
      <h1>Forgot password?</h1>
      <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div id="err" class="err"></div>

      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn-primary" id="send-btn" onclick="sendReset()">Send reset link</button>
      <div class="back">Remember your password? <a href="/login">Sign in</a></div>
    </div>

    <div id="success-state" style="display:none" class="success-state">
      <div class="success-icon">📬</div>
      <h2>Check your inbox</h2>
      <p>We sent a password reset link to <strong id="email-sent"></strong>.<br>It expires in 1 hour.</p>
      <div class="back" style="margin-top:24px"><a href="/login">Back to sign in</a></div>
    </div>
  </div>
</main>

<footer>
  <a href="/">GetBizIdea</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
</footer>

<script>
var SUPABASE_URL = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_URL) || 'https://YOUR_PROJECT.supabase.co';
var SUPABASE_ANON = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_ANON) || 'YOUR_ANON_KEY';
var sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON); } catch(e) {}

function isConfigured() { return SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co'; }

async function sendReset() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showErr('Please enter your email address.'); return; }

  if (!isConfigured()) {
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('email-sent').textContent = email;
    document.getElementById('success-state').style.display = '';
    return;
  }

  var btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'Sending…';

  var { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password'
  });

  if (error) {
    showErr(error.message);
    btn.disabled = false; btn.textContent = 'Send reset link';
  } else {
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('email-sent').textContent = email;
    document.getElementById('success-state').style.display = '';
  }
}

function showErr(msg) {
  var el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 5000);
}

document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendReset();
});
</script>
</body>
</html>
