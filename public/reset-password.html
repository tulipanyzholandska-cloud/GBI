<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set New Password — GetBizIdea</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111827'/><text y='24' x='4' font-size='22'>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
nav{height:60px;padding:0 32px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #E5E7EB}
.logo{font-size:18px;font-weight:800;color:#111827;letter-spacing:-.02em}
.logo span{color:#6366F1}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px;text-align:center}
.subtitle{text-align:center;font-size:14px;color:#6B7280;margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input[type=password]{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;color:#111827;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s;background:#fff}
input:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input::placeholder{color:#9CA3AF}
.btn-primary{width:100%;padding:13px;border-radius:10px;border:none;background:#111827;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .18s;font-family:inherit;margin-top:4px}
.btn-primary:hover{background:#374151}
.btn-primary:disabled{background:#9CA3AF;cursor:not-allowed}
.err{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;font-size:13px;color:#DC2626;margin-bottom:14px;display:none}
.err.show{display:block}
.success-state{text-align:center;padding:20px 0}
.success-icon{font-size:48px;margin-bottom:16px}
.success-state h2{font-size:20px;font-weight:700;margin-bottom:8px}
.success-state p{font-size:14px;color:#6B7280;margin-bottom:24px}
.btn-go{display:inline-block;padding:12px 28px;border-radius:100px;background:#111827;color:#fff;font-size:14px;font-weight:700}
.invalid-state{text-align:center;padding:20px 0}
.invalid-state .icon{font-size:48px;margin-bottom:16px}
.invalid-state h2{font-size:20px;font-weight:700;margin-bottom:8px}
.invalid-state p{font-size:14px;color:#6B7280;margin-bottom:24px}
footer{padding:20px 32px;text-align:center;font-size:12px;color:#9CA3AF}
footer a{color:#9CA3AF}
footer a:hover{color:#6366F1}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">GetBiz<span>Idea</span></a>
</nav>

<main>
  <div class="card">

    <!-- Invalid/expired link state -->
    <div id="invalid-state" style="display:none" class="invalid-state">
      <div class="icon">⚠️</div>
      <h2>Link expired</h2>
      <p>This password reset link has expired or is invalid.<br>Request a new one.</p>
      <a href="/forgot-password" class="btn-go">Request new link</a>
    </div>

    <!-- Reset form -->
    <div id="form-state" style="display:none">
      <h1>Set new password</h1>
      <p class="subtitle">Choose a strong password for your account.</p>
      <div id="err" class="err"></div>
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="password" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" id="password2" placeholder="Repeat password">
      </div>
      <button class="btn-primary" id="save-btn" onclick="savePassword()">Set new password</button>
    </div>

    <!-- Success -->
    <div id="success-state" style="display:none" class="success-state">
      <div class="success-icon">✅</div>
      <h2>Password updated!</h2>
      <p>Your password has been changed successfully.</p>
      <a href="/dashboard" class="btn-go">Go to my plans →</a>
    </div>

  </div>
</main>

<footer>
  <a href="/">GetBizIdea</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
</footer>

<script>
var SUPABASE_URL = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_URL) || 'https://YOUR_PROJECT.supabase.co';
var SUPABASE_ANON = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_ANON) || 'YOUR_ANON_KEY';
var sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON); } catch(e) {}

window.addEventListener('DOMContentLoaded', async function() {
  if (!sb) { document.getElementById('invalid-state').style.display = ''; return; }

  // Supabase puts the access token in the URL hash after a password reset email click
  var hash = window.location.hash;
  if (hash && hash.includes('type=recovery')) {
    document.getElementById('form-state').style.display = '';
  } else {
    // Check if we have an active session (user might have been auto-signed in)
    var { data: { session } } = await sb.auth.getSession();
    if (session) {
      document.getElementById('form-state').style.display = '';
    } else {
      document.getElementById('invalid-state').style.display = '';
    }
  }
});

async function savePassword() {
  var pw = document.getElementById('password').value;
  var pw2 = document.getElementById('password2').value;
  if (!pw || pw.length < 8) { showErr('Password must be at least 8 characters.'); return; }
  if (pw !== pw2) { showErr('Passwords do not match.'); return; }

  var btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  var { error } = await sb.auth.updateUser({ password: pw });
  if (error) {
    showErr(error.message);
    btn.disabled = false; btn.textContent = 'Set new password';
  } else {
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('success-state').style.display = '';
  }
}

function showErr(msg) {
  var el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 5000);
}
</script>
</body>
</html>
