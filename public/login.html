<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — GetBizIdea</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111827'/><text y='24' x='4' font-size='22'>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* NAV */
nav{height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #E5E7EB}
.logo{font-size:18px;font-weight:800;color:#111827;letter-spacing:-.02em}
.logo span{color:#6366F1}

/* MAIN */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}

h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:28px;text-align:center}

/* SOCIAL BUTTONS */
.btn-social{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;color:#374151;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;margin-bottom:10px}
.btn-social:hover{background:#F9FAFB;border-color:#D1D5DB}
.btn-social svg{flex-shrink:0}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#9CA3AF;font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#E5E7EB}

/* FORM */
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;color:#111827;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s;background:#fff}
input:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
input::placeholder{color:#9CA3AF}

.btn-primary{width:100%;padding:13px;border-radius:10px;border:none;background:#111827;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .18s;font-family:inherit;margin-top:4px}
.btn-primary:hover{background:#374151}
.btn-primary:disabled{background:#9CA3AF;cursor:not-allowed}

.form-footer{text-align:center;font-size:13px;color:#6B7280;margin-top:20px}
.form-footer a,.form-footer button{color:#6366F1;font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px}

.forgot{display:block;text-align:right;font-size:12px;color:#9CA3AF;margin-top:-8px;margin-bottom:16px}
.forgot:hover{color:#6366F1}

/* ERROR */
.err{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;font-size:13px;color:#DC2626;margin-bottom:14px;display:none}
.err.show{display:block}

/* SUCCESS */
.success-state{text-align:center;padding:20px 0}
.success-icon{font-size:48px;margin-bottom:16px}
.success-state h2{font-size:20px;font-weight:700;margin-bottom:8px}
.success-state p{font-size:14px;color:#6B7280}

/* TABS */
.tabs{display:flex;background:#F3F4F6;border-radius:10px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:9px;text-align:center;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;color:#6B7280;border:none;background:none;font-family:inherit}
.tab.active{background:#fff;color:#111827;box-shadow:0 1px 4px rgba(0,0,0,.1)}

footer{padding:20px 32px;text-align:center;font-size:12px;color:#9CA3AF}
footer a{color:#9CA3AF}
footer a:hover{color:#6366F1}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">GetBiz<span>Idea</span></a>
</nav>

<main>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Create account</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <h1>Welcome back</h1>
      <button class="btn-social" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or continue with email</div>

      <div id="err-login" class="err"></div>

      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <a href="/forgot-password.html" class="forgot">Forgot password?</a>
      <button class="btn-primary" id="login-btn" onclick="signInEmail()">Sign in</button>
      <div class="form-footer">
        Don't have an account? <button onclick="switchTab('register')">Create one free</button>
      </div>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <h1>Create your account</h1>
      <button class="btn-social" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Sign up with Google
      </button>

      <div class="divider">or use email</div>

      <div id="err-register" class="err"></div>
      <div id="success-register" style="display:none" class="success-state">
        <div class="success-icon">📬</div>
        <h2>Check your inbox</h2>
        <p>We sent a confirmation link to <strong id="reg-email-sent"></strong>.<br>Click it to activate your account.</p>
      </div>

      <div id="reg-fields">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="reg-name" placeholder="Jan Novák" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <button class="btn-primary" id="register-btn" onclick="registerEmail()">Create free account</button>
        <div class="form-footer">
          Already have an account? <button onclick="switchTab('login')">Sign in</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <a href="/">GetBizIdea</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
</footer>

<script>
// ── Supabase config ──────────────────────────────────────────────
// Replace with your actual Supabase project URL and anon key
// Get these at: https://supabase.com/dashboard → Settings → API
var SUPABASE_URL = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_URL) || 'https://YOUR_PROJECT.supabase.co';
var SUPABASE_ANON = (window.GBI_CONFIG && window.GBI_CONFIG.SUPABASE_ANON) || 'YOUR_ANON_KEY';

var sb = null;
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
} catch(e) {
  console.warn('Supabase not configured yet. Add credentials to login.html');
}

// Redirect if already logged in
if (sb) {
  sb.auth.getSession().then(function(r) {
    if (r.data && r.data.session) {
      window.location.href = '/dashboard.html';
    }
  });
}

function isConfigured() {
  return SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co';
}

function switchTab(tab) {
  var isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('form-login').style.display = isLogin ? '' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : '';
}

async function signInGoogle() {
  if (!isConfigured()) { alert('Auth not configured yet. Add Supabase credentials.'); return; }
  var { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/dashboard.html' }
  });
  if (error) showErr('err-login', error.message);
}

async function signInEmail() {
  if (!isConfigured()) { alert('Auth not configured yet.'); return; }
  var btn = document.getElementById('login-btn');
  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-password').value;
  if (!email || !pass) { showErr('err-login', 'Please fill in all fields.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  var { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
  if (error) {
    showErr('err-login', error.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  } else {
    window.location.href = '/dashboard.html';
  }
}

async function registerEmail() {
  if (!isConfigured()) { alert('Auth not configured yet.'); return; }
  var btn = document.getElementById('register-btn');
  var name = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var pass = document.getElementById('reg-password').value;
  if (!name || !email || !pass) { showErr('err-register', 'Please fill in all fields.'); return; }
  if (pass.length < 8) { showErr('err-register', 'Password must be at least 8 characters.'); return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  var { error } = await sb.auth.signUp({
    email: email,
    password: pass,
    options: { data: { full_name: name } }
  });
  if (error) {
    showErr('err-register', error.message);
    btn.disabled = false; btn.textContent = 'Create free account';
  } else {
    document.getElementById('reg-fields').style.display = 'none';
    document.getElementById('success-register').style.display = '';
    document.getElementById('reg-email-sent').textContent = email;
  }
}

function showErr(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 5000);
}

// Check for OAuth redirect
if (sb) {
  sb.auth.onAuthStateChange(function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      window.location.href = '/dashboard.html';
    }
  });
}
</script>
</body>
</html>
